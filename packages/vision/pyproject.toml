[project]
name = "bhashaflow-vision"
version = "0.4.0"
description = "Screen capture and UI grounding for BhashaFlow."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bhashaflow-shared",
  "mss>=10.2.0",
]

[tool.uv.sources]
bhashaflow-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
