[project]
name = "bhashaflow-orchestrator"
version = "0.2.0"
description = "Planner loop for BhashaFlow vision, audio, and action."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bhashaflow-action",
  "bhashaflow-audio",
  "bhashaflow-shared",
  "bhashaflow-vision",
]

[tool.uv.sources]
bhashaflow-action = { workspace = true }
bhashaflow-audio = { workspace = true }
bhashaflow-shared = { workspace = true }
bhashaflow-vision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
