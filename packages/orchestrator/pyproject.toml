[project]
name = "bhashaflow-orchestrator"
version = "0.4.0"
description = "Spoken demo loop for BhashaFlow vision, audio, and action."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bhashaflow-action",
  "bhashaflow-audio",
  "bhashaflow-shared",
  "bhashaflow-vision",
]

[tool.uv.sources]
bhashaflow-action = { workspace = true }
bhashaflow-audio = { workspace = true }
bhashaflow-shared = { workspace = true }
bhashaflow-vision = { workspace = true }

[project.scripts]
bhashaflow = "bhashaflow_orchestrator.live:main"
bhashaflow-demo = "bhashaflow_orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
