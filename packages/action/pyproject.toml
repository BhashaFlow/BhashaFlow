[project]
name = "bhashaflow-action"
version = "0.3.0"
description = "Pointer handoff for BhashaFlow OS actions."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bhashaflow-shared",
  "bhashaflow-vision",
]

[tool.uv.sources]
bhashaflow-shared = { workspace = true }
bhashaflow-vision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
